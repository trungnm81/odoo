Cách Start / Stop Odoo
Tôi đã tạo script run_odoo.sh để bạn dễ dàng quản lý Odoo.

Các lệnh:
🔹 Start Odoo

cd /Users/trung/projects/odoo && ./run_odoo.sh start
Mở trình duyệt tại http://localhost:8069 — đăng nhập với admin / admin

🔹 Stop Odoo

cd /Users/trung/projects/odoo && ./run_odoo.sh stop
🔹 Restart Odoo

cd /Users/trung/projects/odoo && ./run_odoo.sh restart
🔹 Kiểm tra trạng thái

cd /Users/trung/projects/odoo && ./run_odoo.sh status
Hoặc dùng trực tiếp:

# Start (chạy nền):
python3 odoo-bin -c odoo.conf --http-port=8069 -d odoo_dev &

# Stop:
kill $(cat odoo.pid)
Lưu ý: Trước khi start Odoo, cần đảm bảo PostgreSQL container đang chạy:


docker start idp_postgres

